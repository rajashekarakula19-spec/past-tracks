<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" fill="none" role="img" aria-labelledby="title description">
  <title id="title">PastTracks — Every journey has a story.</title>
  <desc id="description">A forest green banner with ivory lettering, a lime route, sage city blocks, and muted blue water.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1200" y2="340" gradientUnits="userSpaceOnUse"><stop stop-color="#173B2D"/><stop offset="1" stop-color="#3C6145"/></linearGradient>
    <linearGradient id="fade" x1="695" y1="0" x2="880" y2="0" gradientUnits="userSpaceOnUse"><stop stop-color="#244C3A" stop-opacity="0"/><stop offset="1" stop-color="#244C3A"/></linearGradient>
    <pattern id="blocks" width="64" height="64" patternTransform="rotate(-22)" patternUnits="userSpaceOnUse"><rect x="5" y="5" width="51" height="51" rx="7" fill="#B1C698" fill-opacity=".13"/><path d="M0 62H64M62 0V64" stroke="#E5EDD9" stroke-opacity=".08" stroke-width="5"/></pattern>
    <clipPath id="bounds"><rect width="1200" height="340" rx="24"/></clipPath>
  </defs>
  <g clip-path="url(#bounds)">
    <rect width="1200" height="340" fill="url(#background)"/>
    <rect x="705" y="-75" width="570" height="490" fill="url(#blocks)"/>
    <path d="M1160-30C1040 45 1180 102 1100 175S1100 274 1060 370H1250V-30Z" fill="#BED7D5" fill-opacity=".3"/>
    <path d="M1160-30C1040 45 1180 102 1100 175S1100 274 1060 370" stroke="#F8F9F2" stroke-opacity=".23" stroke-width="7"/>
    <path d="M776 287L835 262 812 211 875 183 854 133 930 100 958 151 1025 122 1008 82" stroke="#173B2D" stroke-opacity=".5" stroke-width="15" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M776 287L835 262 812 211 875 183 854 133 930 100 958 151 1025 122 1008 82" stroke="#D7EDAC" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="776" cy="287" r="9" fill="#D7EDAC" stroke="#244C3A" stroke-width="4"/>
    <circle cx="1008" cy="82" r="25" fill="#D7EDAC" fill-opacity=".15"/><circle cx="1008" cy="82" r="9" fill="#D7EDAC" stroke="#F8F9F2" stroke-width="4"/>
    <rect x="56" y="45" width="46" height="46" rx="14" fill="#D7EDAC"/>
    <g stroke="#244C3A" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="87" cy="57" r="3.5"/><circle cx="70" cy="79" r="3.5"/><path d="M83 57H71a5.5 5.5 0 0 0 0 11h15a5.5 5.5 0 0 1 0 11H74"/></g>
    <text x="117" y="77" fill="#F8F9F2" font-size="31" font-weight="700" letter-spacing="-1" font-family="Inter,Segoe UI,Arial,sans-serif">PastTracks<tspan fill="#D7EDAC">.</tspan></text>
    <text x="56" y="157" fill="#F8F9F2" font-size="47" font-weight="500" letter-spacing="-1.5" font-family="Inter,Segoe UI,Arial,sans-serif">Every journey has a story.</text>
    <text x="56" y="215" fill="#D7EDAC" font-size="48" font-style="italic" font-family="Georgia,serif">Keep yours.</text>
    <text x="58" y="259" fill="#C0D0B5" font-size="15" font-family="Inter,Segoe UI,Arial,sans-serif">Record your routes. Revisit your world. Relive the moments.</text>
    <circle cx="62" cy="302" r="3" fill="#D7EDAC"/><text x="74" y="306" fill="#AFC59C" font-size="10" font-weight="600" letter-spacing="2" font-family="Inter,Segoe UI,Arial,sans-serif">MADE FOR THE JOURNEY</text>
    <rect x="889" y="226" width="196" height="51" rx="12" fill="#F8F9F2"/>
    <circle cx="917" cy="251" r="13" fill="#E1EBCF"/><path d="m914 245 8 6-8 6z" fill="#244C3A"/>
    <text x="942" y="248" fill="#244C3A" font-size="11" font-weight="600" font-family="Inter,Segoe UI,Arial,sans-serif">A route worth revisiting.</text>
    <text x="942" y="263" fill="#7B8A6C" font-size="9" font-family="Inter,Segoe UI,Arial,sans-serif">Your next story starts here.</text>
  </g>
